<style>
  :root{
    --bg:#0e1116; --panel:#171c24; --panel2:#1f2630; --line:#313b49;
    --txt:#dfe6ee; --dim:#8b96a5; --accent:#5bc85b; --accent2:#e8b53a; --danger:#e06553;
    --slot:#262e3a; --slot-line:#455264;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'ZCOOL QingKe HuangYou','JetBrains Mono',monospace;color:var(--txt)}

  canvas{display:block}
  .panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
  /* 顶部工具条 */
  #toolbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px 10px;z-index:10;align-items:center}
  .tool{font-family:inherit;font-size:17px;letter-spacing:1px;color:var(--dim);background:var(--panel2);border:2px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .12s}
  .tool .ic{font-family:'Silkscreen',monospace;font-size:12px}
  .tool:hover{color:var(--txt);border-color:#55637a}
  .tool.active{color:#0d1208;background:var(--accent);border-color:#7ee07e;box-shadow:0 0 0 2px rgba(91,200,91,.25)}
  .tool.active .ic{color:#0d1208}
  .sep{width:2px;height:26px;background:var(--line);border-radius:2px;margin:0 3px}
  /* 方块调色板 */
  #palette{position:absolute;left:14px;top:50%;transform:translateY(-50%);padding:10px;z-index:10;max-height:78vh;overflow-y:auto;width:236px}
  #palette h3{font-size:16px;letter-spacing:2px;color:var(--accent2);margin-bottom:9px;display:flex;align-items:center;gap:8px}
  #palette h3 .px{font-family:'Silkscreen',monospace;font-size:10px;color:var(--dim)}
  #slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .slot{aspect-ratio:1;background:var(--slot);border:2px solid var(--slot-line);border-radius:6px;cursor:pointer;position:relative;overflow:hidden;transition:transform .1s}
  .slot:hover{transform:scale(1.08);border-color:#6b7c96;z-index:2}
  .slot.active{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(232,181,58,.3)}
  .slot canvas{width:100%;height:100%;image-rendering:pixelated}
  .slot .nm{position:absolute;left:0;right:0;bottom:0;font-size:10px;line-height:1.3;text-align:center;background:rgba(10,13,18,.72);color:var(--txt);padding:1px 0}
  /* 右侧信息面板 */
  #hud{position:absolute;right:14px;top:14px;width:252px;padding:12px 14px;z-index:10;font-size:15px}
  #hud h3{font-size:16px;letter-spacing:2px;color:var(--accent2);margin-bottom:8px}
  .row{display:flex;justify-content:space-between;margin:5px 0;color:var(--dim)}
  .row b{color:var(--txt);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px}
  #coords{font-family:'JetBrains Mono',monospace;font-size:13px;background:#0b0e13;border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin:8px 0;color:var(--accent)}
  .btn{font-family:inherit;font-size:15px;letter-spacing:1px;width:100%;margin-top:7px;padding:8px 0;border-radius:8px;border:2px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;transition:all .12s}
  .btn:hover{border-color:#6b7c96;background:#26303e}
  .btn.green{background:#1e3a1e;border-color:#3d6b3d;color:#a9e8a9}
  .btn.green:hover{border-color:var(--accent)}
  .btn.amber{background:#3a3015;border-color:#6b5c25;color:#f0d791}
  .btn.amber:hover{border-color:var(--accent2)}
  .mini{display:flex;gap:7px}
  .mini .btn{margin-top:7px}
  /* 切片控制 */
  #sliceRow{margin:9px 0 3px;display:none;align-items:center;gap:8px}
  #sliceRow.on{display:flex}
  #sliceY{flex:1;accent-color:var(--accent2)}
  #sliceVal{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent2);min-width:26px;text-align:right}
  /* 底部提示 */
  #hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);padding:8px 18px;font-size:14px;color:var(--dim);z-index:10;letter-spacing:1px}
  #hint b{color:var(--accent)}
  #hint .k{font-family:'Silkscreen',monospace;font-size:10px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--txt);margin:0 2px}
  /* toast */
  #toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);padding:9px 22px;font-size:15px;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;border-color:var(--accent)}
  #toast.show{opacity:1}
  /* AI 接口回显面板 */
  #aiOut{position:absolute;right:14px;bottom:14px;width:340px;max-height:180px;overflow-y:auto;padding:9px 12px;z-index:11;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.55;color:var(--accent);white-space:pre-wrap;word-break:break-all}
  #aiOut::before{content:'AI LINK · window.vd';display:block;font-family:'Silkscreen',monospace;font-size:9px;color:var(--dim);margin-bottom:4px;letter-spacing:1px}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  @media (max-width:1100px){#palette{width:200px}#slots{grid-template-columns:repeat(4,1fr)}}
</style>

<script>
const THREE = window.THREE;

/* ---------------- 方块注册表（程序化 16px 像素纹理） ---------------- */
function makeTex(draw){
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d');
  draw(g);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.encoding = THREE.sRGBEncoding;
  return t;
}
function noise(g, base, vary, alpha=1){
  g.fillStyle = base; g.fillRect(0,0,16,16);
  for(let y=0;y<16;y++)for(let x=0;x<16;x++){
    const v = (Math.random()*2-1)*vary;
    g.fillStyle = `rgba(${v>0?255:0},${v>0?255:0},${v>0?255:0},${Math.abs(v)})`;
    if(alpha<1 && Math.random()<0.12){ g.fillStyle = `rgba(255,255,255,${alpha})`; g.fillRect(x,y,1,1); }
    g.fillRect(x,y,1,1);
  }
}
const BLOCKS = {
  grass_block:{label:'草方块', mc:'minecraft:grass_block', tex:()=>makeTex(g=>{ noise(g,'#7fb238',.10); g.fillStyle='#79553a'; g.fillRect(0,10,16,6); noise(g,'#79553a',0); for(let x=0;x<16;x++){g.fillStyle='#7fb238';g.fillRect(x,9-(x%3===0?1:0),1,2);} })},
  dirt:{label:'泥土', mc:'minecraft:dirt', tex:()=>makeTex(g=>noise(g,'#79553a',.13))},
  stone:{label:'石头', mc:'minecraft:stone', tex:()=>makeTex(g=>noise(g,'#7f7f7f',.09))},
  cobblestone:{label:'圆石', mc:'minecraft:cobblestone', tex:()=>makeTex(g=>{ noise(g,'#6e6e6e',.05); for(let i=0;i<14;i++){ g.fillStyle=`rgba(${120+Math.random()*40|0},${120+Math.random()*40|0},${120+Math.random()*40|0},.9)`; const s=2+Math.random()*3|0; g.fillRect(Math.random()*14|0,Math.random()*14|0,s,s);} g.strokeStyle='#4c4c4c'; g.strokeRect(0,0,16,16); })},
  mossy_cobblestone:{label:'苔圆石', mc:'minecraft:mossy_cobblestone', tex:()=>makeTex(g=>{ noise(g,'#5f6e55',.08); for(let i=0;i<10;i++){ g.fillStyle='rgba(90,130,70,.85)'; g.fillRect(Math.random()*13|0,Math.random()*13|0,2+Math.random()*3|0,2);} })},
  stone_bricks:{label:'石砖', mc:'minecraft:stone_bricks', tex:()=>makeTex(g=>{ noise(g,'#7a7a7a',.06); g.strokeStyle='#565656'; g.lineWidth=1; g.strokeRect(.5,.5,15,15); g.beginPath(); g.moveTo(0,8.5);g.lineTo(16,8.5); g.moveTo(8.5,0);g.lineTo(8.5,8); g.moveTo(4.5,8);g.lineTo(4.5,16); g.moveTo(12.5,8);g.lineTo(12.5,16); g.stroke(); })},
  oak_planks:{label:'橡木板', mc:'minecraft:oak_planks', tex:()=>makeTex(g=>{ noise(g,'#a8824e',.07); g.strokeStyle='#7d5c33'; for(let y=3;y<16;y+=4){g.beginPath();g.moveTo(0,y+.5);g.lineTo(16,y+.5);g.stroke();} })},
  spruce_planks:{label:'云杉板', mc:'minecraft:spruce_planks', tex:()=>makeTex(g=>{ noise(g,'#7a5a35',.07); g.strokeStyle='#57402a'; for(let y=3;y<16;y+=4){g.beginPath();g.moveTo(0,y+.5);g.lineTo(16,y+.5);g.stroke();} })},
  oak_log:{label:'橡木原木', mc:'minecraft:oak_log', tex:()=>makeTex(g=>{ noise(g,'#6b5433',.06); g.strokeStyle='#4e3d24'; for(let x=2;x<16;x+=4){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,16);g.stroke();} })},
  spruce_log:{label:'云杉原木', mc:'minecraft:spruce_log', tex:()=>makeTex(g=>{ noise(g,'#4e3a22',.06); g.strokeStyle='#382918'; for(let x=2;x<16;x+=4){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,16);g.stroke();} })},
  bricks:{label:'红砖', mc:'minecraft:bricks', tex:()=>makeTex(g=>{ g.fillStyle='#96513d'; g.fillRect(0,0,16,16); g.fillStyle='#b0b0ab'; for(let y=0;y<16;y+=4)g.fillRect(0,y,16,1); for(let y=0;y<16;y+=8){for(let x=(y%8?2:6);x<16;x+=8)g.fillRect(x,y,1,4);} })},
  sand:{label:'沙子', mc:'minecraft:sand', tex:()=>makeTex(g=>noise(g,'#dbcf9c',.06))},
  gravel:{label:'沙砾', mc:'minecraft:gravel', tex:()=>makeTex(g=>{ noise(g,'#8a8580',.10); for(let i=0;i<8;i++){g.fillStyle='rgba(60,58,55,.5)';g.fillRect(Math.random()*14|0,Math.random()*14|0,2,2);} })},
  andesite:{label:'安山岩', mc:'minecraft:andesite', tex:()=>makeTex(g=>noise(g,'#888c8a',.06))},
  glass:{label:'玻璃', mc:'minecraft:glass', transparent:true, tex:()=>makeTex(g=>{ g.clearRect(0,0,16,16); g.fillStyle='rgba(200,230,240,.16)'; g.fillRect(0,0,16,16); g.strokeStyle='rgba(225,245,250,.85)'; g.strokeRect(.5,.5,15,15); g.fillStyle='rgba(255,255,255,.55)'; g.fillRect(2,2,4,1); g.fillRect(2,3,1,3); })},
  water:{label:'水', mc:'minecraft:water', transparent:true, tex:()=>makeTex(g=>{ g.fillStyle='rgba(50,100,210,.55)'; g.fillRect(0,0,16,16); g.fillStyle='rgba(120,170,255,.4)'; for(let i=0;i<5;i++)g.fillRect(Math.random()*12|0,Math.random()*14|0,3+Math.random()*3|0,1); })},
  white_concrete:{label:'白混凝土', mc:'minecraft:white_concrete', tex:()=>makeTex(g=>noise(g,'#cfd5d6',.03))},
  red_concrete:{label:'红混凝土', mc:'minecraft:red_concrete', tex:()=>makeTex(g=>noise(g,'#a12722',.05))},
  yellow_concrete:{label:'黄混凝土', mc:'minecraft:yellow_concrete', tex:()=>makeTex(g=>noise(g,'#e5c024',.04))},
  blue_concrete:{label:'蓝混凝土', mc:'minecraft:blue_concrete', tex:()=>makeTex(g=>noise(g,'#2d48a0',.05))},
  glowstone:{label:'萤石', mc:'minecraft:glowstone', tex:()=>makeTex(g=>{ noise(g,'#b0893f',.10); for(let i=0;i<8;i++){g.fillStyle='rgba(255,235,160,.95)';g.fillRect(Math.random()*13|0,Math.random()*13|0,2,2);} })},
  oak_leaves:{label:'橡树树叶', mc:'minecraft:oak_leaves[persistent=true]', transparent:true, tex:()=>makeTex(g=>{ g.clearRect(0,0,16,16); for(let y=0;y<16;y++)for(let x=0;x<16;x++){ g.fillStyle=Math.random()<.82?(Math.random()<.5?'#3e7a1e':'#4c9426'):'rgba(0,0,0,0)'; g.fillRect(x,y,1,1);} })},
  /* ---- 造型与装饰方块（2026-09-07 扩充；游戏内默认状态：半砖=下半、楼梯朝北、栅栏墙自动连接） ---- */
  stone_brick_slab:{label:'石砖半砖', mc:'minecraft:stone_brick_slab', transparent:true, tex:()=>makeTex(g=>{ g.clearRect(0,0,16,16); g.drawImage(BLOCKS.stone_bricks.tex().image,0,8,16,8,0,8,16,8); g.fillStyle='rgba(220,225,228,.95)'; g.fillRect(0,8,16,1); })},
  cobblestone_slab:{label:'圆石半砖', mc:'minecraft:cobblestone_slab', transparent:true, tex:()=>makeTex(g=>{ g.clearRect(0,0,16,16); g.drawImage(BLOCKS.cobblestone.tex().image,0,8,16,8,0,8,16,8); g.fillStyle='rgba(200,200,200,.95)'; g.fillRect(0,8,16,1); })},
  oak_slab:{label:'橡木半砖', mc:'minecraft:oak_slab', transparent:true, tex:()=>makeTex(g=>{ g.clearRect(0,0,16,16); g.drawImage(BLOCKS.oak_planks.tex().image,0,8,16,8,0,8,16,8); g.fillStyle='rgba(200,170,120,.95)'; g.fillRect(0,8,16,1); })},
  spruce_slab:{label:'云杉半砖', mc:'minecraft:spruce_slab', transparent:true, tex:()=>makeTex(g=>{ g.clearRect(0,0,16,16); g.drawImage(BLOCKS.spruce_planks.tex().image,0,8,16,8,0,8,16,8); g.fillStyle='rgba(150,115,70,.95)'; g.fillRect(0,8,16,1); })},
  stone_brick_stairs:{label:'石砖楼梯', mc:'minecraft:stone_brick_stairs', transparent:true, tex:()=>makeTex(g=>{ g.clearRect(0,0,16,16); g.drawImage(BLOCKS.stone_bricks.tex().image,0,8,16,8,0,8,16,8); g.drawImage(BLOCKS.stone_bricks.tex().image,0,0,8,8,0,0,8,8); g.strokeStyle='#4a4a4a'; g.strokeRect(.5,.5,15,15); })},

/* ---------------- 体素数据 ---------------- */
const voxels = new Map();               // "x,y,z" -> blockId
let group = new THREE.Group(); scene.add(group);
const meshIndex = new Map();            // mcName -> { mesh, keys[] }
const keyOf = (x,y,z) => x+','+y+','+z;

let sliceOn = false, sliceY = 8;
function visible(y){ return !sliceOn || y <= sliceY; }

const boxGeo = new THREE.BoxGeometry(1,1,1);
function rebuild(){
  scene.remove(group);
  group.traverse(o => { if(o.geometry && o.geometry!==boxGeo) o.geometry.dispose?.(); });
  group = new THREE.Group(); scene.add(group);
  meshIndex.clear();
  const buckets = new Map();
  for(const [k, id] of voxels){
    const [x,y,z] = k.split(',').map(Number);
    if(!visible(y)) continue;
    if(!buckets.has(id)) buckets.set(id, []);
    buckets.get(id).push([x,y,z,k]);
  }
  for(const [id, list] of buckets){
    const def = BLOCKS[id];
    const mat = new THREE.MeshLambertMaterial({ map:def.tex(), transparent:!!def.transparent, opacity:def.transparent?0.95:1, alphaTest:def.transparent?0.08:0 });
    const mesh = new THREE.InstancedMesh(boxGeo, mat, list.length);
    const m = new THREE.Matrix4();
    const keys = [];
    list.forEach(([x,y,z,k], i) => {
      m.setPosition(x+.5, y+.5, z+.5);
      mesh.setMatrixAt(i, m);
      keys.push({ k, x, y, z });
    });
    mesh.userData = { id, keys };
    meshIndex.set(id, { mesh, keys });
    group.add(mesh);
  }
  updateStats();
}

/* ---------------- 交互 ---------------- */
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
let tool = 'build';            // build | erase | rect
let current = 'stone_bricks';
let hoverCell = null;          // {x,y,z, place:{x,y,z}}
let rectA = null;
const undoStack = [];

function pick(){
  raycaster.setFromCamera(mouseNDC, camera);
  const meshes = [...meshIndex.values()].map(e => e.mesh);
  const hits = raycaster.intersectObjects([...meshes, ground], false);
  if(!hits.length) return null;
  const h = hits[0];
  if(h.object === ground){
    const x = Math.floor(h.point.x), z = Math.floor(h.point.z);
    return { target:null, place:{ x, y:0, z } };
  }
  const info = h.object.userData;
  const ent = info.keys[h.instanceId];
  const n = h.face.normal.clone().round();
  return {
    target:{ x:ent.x, y:ent.y, z:ent.z },
    place:{ x:ent.x+n.x, y:ent.y+n.y, z:ent.z+n.z }
  };
}

function setVoxel(x,y,z,id){
  const k = keyOf(x,y,z);
  const prev = voxels.get(k);
  if(prev === id) return null;
  if(id === null){ if(!voxels.has(k)) return null; voxels.delete(k); }
  else voxels.set(k, id);
  return { k, prev: prev ?? null, next: id };
}

function applyTool(cell){
  if(!cell) return;
  if(tool === 'build'){
    const p = cell.place, d = BLOCKS[current].mc;
    const rec = setVoxel(p.x, p.y, p.z, current);
    if(rec){ undoStack.push([rec]); rebuild(); }
  } else if(tool === 'erase'){
    const t = cell.target;
    if(!t) return;
    const rec = setVoxel(t.x, t.y, t.z, null);
    if(rec){ undoStack.push([rec]); rebuild(); }
  } else if(tool === 'rect'){
    const p = cell.place;
    if(!rectA){ rectA = { ...p }; toast('已选起点，再点对角终点'); return; }
    const x0=Math.min(rectA.x,p.x), x1=Math.max(rectA.x,p.x);
    const z0=Math.min(rectA.z,p.z), z1=Math.max(rectA.z,p.z);
    const y = rectA.y;
    const batch = [];
    for(let x=x0;x<=x1;x++)for(let z=z0;z<=z1;z++){
      const rec = setVoxel(x,y,z,current);
      if(rec) batch.push(rec);
    }
    if(batch.length) undoStack.push(batch);
    rectA = null; rectPreview.visible = false;
    rebuild();
  }
}

function undo(){
  const batch = undoStack.pop();
  if(!batch){ toast('没有可撤销的操作'); return; }
  for(const rec of batch){
    if(rec.next === null) voxels.set(rec.k, rec.prev);
    else voxels.delete(rec.k);
  }
  rebuild();
}

/* 统计与导出 */
function updateStats(){
  let minx=1e9,miny=1e9,minz=1e9,maxx=-1e9,maxy=-1e9,maxz=-1e9;
  for(const k of voxels.keys()){
    const [x,y,z]=k.split(',').map(Number);
    minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y);minz=Math.min(minz,z);maxz=Math.max(maxz,z);
  }
  $('#cCount').textContent = voxels.size;
  $('#cSize').textContent = voxels.size ? `${maxx-minx+1} × ${maxy-miny+1} × ${maxz-minz+1}` : '0 × 0 × 0';
  $('#cSize').dataset.min = voxels.size ? JSON.stringify([minx,miny,minz]) : '';
}
function blueprintData(){
  if(!voxels.size) return null;
  let minx=1e9,miny=1e9,minz=1e9,maxx=-1e9,maxy=-1e9,maxz=-1e9;
  for(const k of voxels.keys()){
    const [x,y,z]=k.split(',').map(Number);
    minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y);minz=Math.min(minz,z);maxz=Math.max(maxz,z);
  }
  const blocks = [];
  for(const [k,id] of voxels){
    const [x,y,z]=k.split(',').map(Number);
    blocks.push({ x:x-minx, y:y-miny, z:z-minz, block:BLOCKS[id].mc });
  }
  return { width:maxx-minx+1, height:maxy-miny+1, length:maxz-minz+1, source:'web-designer', origin_min:[minx,miny,minz], blocks };
}
$('#bExport').onclick = () => {

  if(!data){ toast('画布是空的'); return; }
  const blob = new Blob([JSON.stringify(data,null,1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'blueprint.json'; a.click();
  toast(`已导出 ${data.blocks.length} 方块 → blueprint.json（直接可喂给建造流水线）`);
};
$('#bImport').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = e => {
  const f = e.target.files[0]; if(!f) return;

};
function loadFromData(data){
  const arr = Array.isArray(data) ? data : data.blocks;
  if(!Array.isArray(arr)) throw new Error('不是有效的蓝图 JSON：缺少 blocks 数组');
  // 清空前推一份可撤销快照
  if(voxels.size){
    const snap = [];
    for(const [k,id] of voxels) snap.push({ k, prev:id, next:null });
    undoStack.push(snap);
  }
  voxels.clear();
  let n = 0, skipped = 0;
  for(const b of arr){
    const [x,y,z] = Array.isArray(b) ? [b[0],b[1],b[2]] : [b.x,b.y,b.z];
    const block = (Array.isArray(b) ? b[3] : b.block) || '';
    const id = Object.keys(BLOCKS).find(k => BLOCKS[k].mc === block || k === block.replace('minecraft:',''));
    if(!id){ skipped++; continue; }
    voxels.set(keyOf(x,y,z), id); n++;
  }
  rebuild(); fitCamera();
  return { loaded:n, skipped };
}
function loadJSON(txt){
  try{
    const { loaded, skipped } = loadFromData(JSON.parse(txt));
    toast(`已导入 ${loaded} 方块${skipped?`（${skipped} 个未知方块跳过）`:''}`);
  }catch(err){ toast('导入失败：' + (err.message || '不是有效的蓝图 JSON')); }
}
function loadSample(){
  voxels.clear(); undoStack.length = 0;
  const put = (x,y,z,id) => voxels.set(keyOf(x,y,z), id);
  for(let x=0;x<5;x++)for(let z=0;z<5;z++){
    const c=(x===0||x===4)&&(z===0||z===4);
    put(x,0,z, c?'mossy_cobblestone':(x===2&&z===2?'cobblestone':'stone_bricks'));
  }
  for(let x=1;x<=3;x++)for(let z=1;z<=3;z++) put(x,1,z,(x===2&&z===2)?'water':'cobblestone');
  for(const [x,z] of [[1,1],[3,1],[1,3],[3,3]]){ put(x,2,z,'spruce_log'); put(x,3,z,'spruce_log'); }
  for(const [x,z] of [[2,1],[1,2],[3,2],[2,3]]) put(x,2,z,'cobblestone');
  for(let x=1;x<=3;x++)for(let z=1;z<=3;z++) put(x,4,z,'spruce_planks');
  put(2,5,2,'glowstone');
  rebuild(); fitCamera();
  return voxels.size;
}

function fitCamera(){
  if(!voxels.size) return;
  const [minx,miny,minz] = JSON.parse($('#cSize').dataset.min || '[0,0,0]');
  const [sx,sy,sz] = $('#cSize').textContent.split('×').map(s=>+s.trim());
  controls.target.set(minx+sx/2, miny+sy/2, minz+sz/2);
  const d = Math.max(sx,sy,sz) * 1.8 + 8;
  camera.position.set(controls.target.x + d*.7, controls.target.y + d*.6, controls.target.z + d*.7);
  controls.update();
}

/* 鼠标事件 */
let downPos = null;
renderer.domElement.addEventListener('pointermove', e => {
  mouseNDC.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
});
renderer.domElement.addEventListener('pointerdown', e => {
  if(e.button !== 0) return;
  downPos = { x:e.clientX, y:e.clientY };
});
renderer.domElement.addEventListener('pointerup', e => {
  if(e.button !== 0 || !downPos) return;
  const moved = Math.hypot(e.clientX-downPos.x, e.clientY-downPos.y);
  downPos = null;
  if(moved > 4) return;             // 拖动视为视角操作
  mouseNDC.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  applyTool(pick());
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

addEventListener('keydown', e => {

  if(e.key.toLowerCase()==='r' && !e.ctrlKey && !e.metaKey){ camera.position.set(18,14,22); controls.target.set(6,3,6); controls.update(); }
});

/* ================= AI 程序化接口（window.vd） =================
   给浏览器自动化 Agent 用：JS evaluate 直接调用，无需模拟鼠标。
   所有方法同步返回 JSON 结果，并镜像到 #aiOut 面板（截图可读）。 */
const aiOutEl = $('#aiOut');
function aiLog(tag, data){
  let txt = tag + ' ' + JSON.stringify(data);
  if(txt.length > 1200) txt = txt.slice(0, 1200) + ' …(截断)';
  aiOutEl.textContent = txt;
  aiOutEl.scrollTop = aiOutEl.scrollHeight;
}
function aiWrap(name, fn){
  return (...args) => {
    let result;
    try{ result = fn(...args); }
    catch(err){ result = { ok:false, error:String(err && err.message || err) }; }
    result = Object.assign({ api:name, ok:true }, result);
    window.vd.last = result;
    aiLog('»', result);
    return result;
  };
}
function aiCoords(x,y,z){
  for(const v of [x,y,z]) if(!Number.isInteger(v)) throw new Error(`坐标必须是整数，收到 (${x}, ${y}, ${z})`);
  return [x,y,z];
}
function aiBlockId(id){
  if(id == null) return current;
  const key = String(id).replace('minecraft:','');
  if(!BLOCKS[key]) throw new Error(`未知方块 "${id}"，可用：vd.blocks()`);
  return key;
}
function aiAutoDist(){
  if(!voxels.size) return 24;
  const [sx,sy,sz] = $('#cSize').textContent.split('×').map(s=>+s.trim());
  return Math.max(sx,sy,sz) * 1.8 + 8;
}
const vd = {};
vd.help = aiWrap('help', () => ({
  desc:'体素蓝图设计器 AI 接口。坐标为绝对世界格坐标，y=0 是地面。',
  flow:'build(list) 摆方块 → view("fit") 调相机 → 截图看效果 → state() 查进度 → export() 导蓝图 JSON 交给建造流水线',
  methods:{
    help:'本说明',
    blocks:'列出可用方块调色板 [{id,label,mc}]',
    select:'select(id) 选中默认方块（后续 place 不带 id 时用它）',
    place:'place(x,y,z,id?) 放一个方块',
    erase:'erase(x,y,z) 擦除一个方块',
    box:'box(x1,y1,z1,x2,y2,z2, id|null) 长方体批量填充；id=null 或 "air" 表示清空该区域',
    build:'build([[x,y,z,"stone_bricks"],…]) 批量摆放，一次撤销批次、一次重建（效率最高）',
    voxels:'列出当前全部已放方块 [[x,y,z,"minecraft:…"],…]',
    state:'当前状态：方块数/尺寸/各方块计数/工具/切片/相机',
    undo:'撤销上一步操作',
    clear:'清空画布（自动接口不弹确认框）',
    load:'load(blueprintJSON) 导入蓝图数据（覆盖画布，可撤销）',
    export:'导出蓝图 JSON（直接 return 给 AI，无需下载文件）',
    download:'触发浏览器下载 blueprint.json',
    view:'view("iso|front|back|left|right|top|fit") 相机预设',
    orbit:'orbit(yawDeg,pitchDeg,dist?,tx?,ty?,tz?) 精确控制相机绕目标旋转',
    slice:'slice(on, y?) 只显示 y≤y 的切片（看建筑内部）',
    screenshot:'返回画布 dataURL（AI 也可以直接用浏览器截图工具）',
    sample:'载入示例：中世纪水井'
  }
}));
vd.blocks = aiWrap('blocks', () => ({
  palette:Object.entries(BLOCKS).map(([id,d]) => ({ id, label:d.label, mc:d.mc })),
  current
}));
vd.select = aiWrap('select', (id) => {
  current = aiBlockId(id);
  document.querySelectorAll('.slot').forEach(s => s.classList.toggle('active', s.dataset.id === current));
  if(tool === 'erase') setTool('build');
  return { selected:current, label:BLOCKS[current].label };
});
vd.place = aiWrap('place', (x,y,z,id) => {
  [x,y,z] = aiCoords(x,y,z);
  const bid = aiBlockId(id);
  const rec = setVoxel(x,y,z,bid);
  if(rec) undoStack.push([rec]);
  rebuild();
  return { placed:!!rec, at:[x,y,z], block:BLOCKS[bid].mc, blockCount:voxels.size };
});
vd.erase = aiWrap('erase', (x,y,z) => {
  [x,y,z] = aiCoords(x,y,z);
  const rec = setVoxel(x,y,z,null);
  if(rec) undoStack.push([rec]);
  rebuild();
  return { erased:!!rec, at:[x,y,z], blockCount:voxels.size };
});
vd.box = aiWrap('box', (x1,y1,z1,x2,y2,z2,id) => {
  [x1,y1,z1] = aiCoords(x1,y1,z1); [x2,y2,z2] = aiCoords(x2,y2,z2);
  const vol = (Math.abs(x2-x1)+1)*(Math.abs(y2-y1)+1)*(Math.abs(z2-z1)+1);
  if(vol > 200000) throw new Error(`区域 ${vol} 格，超过 20 万上限`);
  const bid = (id == null || id === 'air' || id === 'minecraft:air') ? null : aiBlockId(id);
  const batch = [];
  for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)
    for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)
      for(let z=Math.min(z1,z2);z<=Math.max(z1,z2);z++){
        const rec = setVoxel(x,y,z,bid);
        if(rec) batch.push(rec);
      }
  if(batch.length) undoStack.push(batch);
  rebuild();
  return { changed:batch.length, regionVolume:vol, mode:bid===null?'erase':'fill '+BLOCKS[bid].mc, blockCount:voxels.size };
});
vd.build = aiWrap('build', (list) => {
  if(!Array.isArray(list) || !list.length) throw new Error('build 需要非空数组，元素为 [x,y,z,"方块名"] 或 {x,y,z,block}');
  if(list.length > 200000) throw new Error(`单次 build 上限 20 万方块，收到 ${list.length}`);
  const batch = []; let skipped = 0, overwritten = 0;
  for(const b of list){
    const [x,y,z] = aiCoords(...(Array.isArray(b) ? [b[0],b[1],b[2]] : [b.x,b.y,b.z]));
    const raw = Array.isArray(b) ? b[3] : b.block;
    let key = String(raw == null ? current : raw).replace('minecraft:','');
    if(!BLOCKS[key]){ skipped++; continue; }
    const rec = setVoxel(x,y,z,key);
    if(rec){ batch.push(rec); if(rec.prev) overwritten++; }
  }
  if(batch.length) undoStack.push(batch);
  rebuild();
  const st = vd.state(false);
  return { changed:batch.length, overwritten, skippedUnknown:skipped, blockCount:st.blockCount, size:st.size };
});
vd.voxels = aiWrap('voxels', () => ({
  blockCount:voxels.size,
  list:[...voxels.entries()].map(([k,id]) => { const [x,y,z]=k.split(',').map(Number); return [x,y,z,BLOCKS[id].mc]; })
}));
vd.state = aiWrap('state', (verbose) => {
  let minx=1e9,miny=1e9,minz=1e9,maxx=-1e9,maxy=-1e9,maxz=-1e9;
  const counts = {};
  for(const [k,id] of voxels){
    const [x,y,z]=k.split(',').map(Number);
    minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y);minz=Math.min(minz,z);maxz=Math.max(maxz,z);
    counts[BLOCKS[id].mc]=(counts[BLOCKS[id].mc]||0)+1;
  }
  const st = {
    blockCount:voxels.size,
    size:voxels.size?[maxx-minx+1,maxy-miny+1,maxz-minz+1]:[0,0,0],
    min:voxels.size?[minx,miny,minz]:null,
    max:voxels.size?[maxx,maxy,maxz]:null,
    counts,
    current, tool,
    slice:{ on:sliceOn, y:sliceOn?sliceY:null },
    camera:{ pos:camera.position.toArray().map(v=>+v.toFixed(1)), target:controls.target.toArray().map(v=>+v.toFixed(1)) },
    undoDepth:undoStack.length
  };
  if(verbose === false) delete st.counts;   // build() 内部调用时精简
  return st;
});
vd.undo = aiWrap('undo', () => { const before = undoStack.length; undo(); return { undone:before-undoStack.length > 0, undoDepth:undoStack.length, blockCount:voxels.size }; });
vd.clear = aiWrap('clear', () => { const n = voxels.size; voxels.clear(); undoStack.length = 0; rebuild(); return { cleared:n }; });
vd.load = aiWrap('load', (data) => ({ ...loadFromData(data), blockCount:voxels.size }));
vd.export = aiWrap('export', () => {
  const data = blueprintData();
  if(!data) return { ok:false, error:'画布是空的，没有可导出的蓝图' };
  return { blockCount:data.blocks.length, size:[data.width,data.height,data.length], blueprint:data };
});
vd.download = aiWrap('download', () => {
  const data = blueprintData();
  if(!data) return { ok:false, error:'画布是空的' };
  const blob = new Blob([JSON.stringify(data,null,1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'blueprint.json'; a.click();
  return { downloaded:'blueprint.json', blockCount:data.blocks.length };
});
function aiSetCam(dx,dy,dz,t){
  controls.target.set(t[0], t[1], t[2]);
  camera.position.set(t[0]+dx, t[1]+dy, t[2]+dz);
  controls.update();
  return { pos:camera.position.toArray().map(v=>+v.toFixed(1)), target:t };
}
vd.view = aiWrap('view', (preset) => {
  if(voxels.size){ fitCamera(); }
  const t = controls.target.toArray();
  const d = aiAutoDist();
  switch(preset){
    case undefined: case 'fit': case 'iso':
      if(preset === 'fit' || !voxels.size) return { view:preset||'fit', pos:camera.position.toArray().map(v=>+v.toFixed(1)), target:t };
      break;
    case 'front': return { view:'front', ...aiSetCam(0, d*.25, d, t) };       // 从 +z 看向 -z
    case 'back':  return { view:'back',  ...aiSetCam(0, d*.25, -d, t) };
    case 'left':  return { view:'left',  ...aiSetCam(-d, d*.25, 0, t) };      // 从 -x 看
    case 'right': return { view:'right', ...aiSetCam(d, d*.25, 0, t) };
    case 'top':   return { view:'top',   ...aiSetCam(0.001*d, d, 0.001*d, t) };
  }
  return { view:'iso', ...aiSetCam(d*.7, d*.6, d*.7, t) };
});
vd.orbit = aiWrap('orbit', (yawDeg, pitchDeg, dist, tx, ty, tz) => {
  if(!Number.isFinite(+yawDeg) || !Number.isFinite(+pitchDeg)) throw new Error('orbit 需要 yawDeg, pitchDeg（角度制）');
  const t = [tx,ty,tz].every(v => Number.isFinite(+v)) ? [tx,ty,tz] : controls.target.toArray();
  const yaw = yawDeg*Math.PI/180, pitch = Math.max(0.05, Math.min(1.5, pitchDeg*Math.PI/180));
  const d = Number.isFinite(+dist) && +dist > 1 ? +dist : aiAutoDist();
  return { ...aiSetCam(d*Math.cos(pitch)*Math.sin(yaw), d*Math.sin(pitch), d*Math.cos(pitch)*Math.cos(yaw), t), dist:d };
});
vd.slice = aiWrap('slice', (on, y) => {
  sliceOn = !!on;
  if(sliceOn){
    if(Number.isInteger(+y)) sliceY = +y;
    $('#sliceY').value = sliceY; $('#sliceVal').textContent = sliceY;
  }
  $('#tSlice').classList.toggle('active', sliceOn);
  $('#sliceRow').classList.toggle('on', sliceOn);
  rebuild();
  const st = vd.state(false);
  return { slice:sliceOn?{on:true, y:sliceY}:{on:false}, visibleBlocks:st.blockCount };
});
vd.screenshot = aiWrap('screenshot', () => {
  renderer.render(scene, camera);
  return { dataUrl:renderer.domElement.toDataURL('image/png'), note:'PNG dataURL；也可以直接用浏览器自动化自带的截图功能' };
});
vd.sample = aiWrap('sample', () => ({ loaded:loadSample(), blockCount:voxels.size }));
Object.freeze(vd);
window.vd = vd;

/* 主循环 */
const hoverMat4 = new THREE.Matrix4();
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  const hit = pick();
  if(hit && (hit.place || hit.target)){
    const c = (tool==='erase'||(tool==='rect'&&rectA)) ? (hit.target||hit.place) : hit.place;
    hoverCell = hit;
    outline.visible = true;
    outline.position.set(c.x+.5, c.y+.5, c.z+.5);
    outline.material.color.set(tool==='erase' ? 0xe06553 : 0xffffff);
    $('#coords').textContent = `瞄准: (${c.x}, ${c.y}, ${c.z})` + (hit.target?`  [块]`:'  [地]');
    if(tool==='rect' && rectA){
      const p = hit.place;
      const x0=Math.min(rectA.x,p.x),x1=Math.max(rectA.x,p.x);
      const z0=Math.min(rectA.z,p.z),z1=Math.max(rectA.z,p.z);
      rectPreview.visible = true;
      rectPreview.scale.set(x1-x0+1,1,z1-z0+1);
      rectPreview.position.set((x0+x1)/2+.5, rectA.y+.5, (z0+z1)/2+.5);
    }
  } else {
    hoverCell = null; outline.visible = false;
    $('#coords').textContent = '瞄准: (-, -, -)';
  }
  renderer.render(scene, camera);
}
rebuild();
if(location.hash === '#sample') $('#bSample').click();
if(location.hash === '#ai'){
  /* AI 接口自测：select → box → build → erase → state → view → export → undo */
  const log = (...a) => console.log('[vd-selftest]', ...a);
  log('palette:', vd.blocks().palette.length, '种方块');
  log(vd.select('oak_planks'));
  log(vd.box(-2,0,-2,2,0,2,'stone_bricks'));
  log(vd.build([[0,1,0,'oak_log'],[0,2,0,'oak_log'],[1,3,0,'glowstone'],[0,3,1,'glass']]));
  log(vd.erase(1,3,0));
  log('state:', vd.state());
  log(vd.view('front'));
  log('export:', vd.export().blockCount, '方块');
  log(vd.undo());
  log('undo 后:', vd.state());
}
animate();
toast('左键放置方块，右键旋转视角。试试「示例」按钮！');
$('#hintApi').onclick = () => { vd.help(); toast('接口说明已输出到控制台和右下角 AI LINK 面板'); };
</script>
